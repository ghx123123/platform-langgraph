version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LLM_PROVIDER=mock
      - DATABASE_PATH=/app/data/platform.db
      - CHECKPOINT_PATH=/app/data/checkpoints.db
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ../backend:/app/backend
      - ./data:/app/data
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
